name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'true'
      - name: Run samples/github/github.xml demo into the step summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/demo-summary.sh

  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML configs and schema (well-formedness, XML 1.1)
        run: |
          curl -fsSL --compressed -o /usr/local/bin/xml-validator \
            "https://dl.pazer.build/xml-validator?os=linux&arch=amd64"
          chmod +x /usr/local/bin/xml-validator
          xml-validator api.example.xml
          xml-validator api.schema.xsd
          xml-validator samples/github/github.xml

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-test
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push
        run: |
          branch_tag="$(echo "${{ github.ref_name }}" | tr '/' '-')"
          tags="--tag ghcr.io/${{ github.repository_owner }}/github:${branch_tag}"
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            tags="${tags} --tag ghcr.io/${{ github.repository_owner }}/github:latest"
          fi
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file samples/github/Dockerfile.github \
            ${tags} \
            --push \
            .
