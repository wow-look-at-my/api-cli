name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@ste-lint#latest
      # tidy confines a dependency's generate directives here, and refuses them without a backend.
      - name: Provision the sandbox backend (bubblewrap)
        run: |
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 refuses an unprivileged user namespace unless this is off.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: wow-look-at-my/go-toolchain@master
        with:
          autorelease: 'true'
      - name: Run samples/github/github.xml demo into the step summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/demo-summary.sh

  validate-xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The schema is an XML 1.1 document too, and a pattern covers a file added later.
      - uses: wow-look-at-my/xml-validator@master
        with:
          files: '**/*.xml **/*.xsd **/*.tml'

      # The grammar check is a Go test, which reads the schema from api-cli-spec.
